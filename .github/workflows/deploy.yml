name: Deploy

# Publishes the in-browser OmniLaya (local/) to Cloudflare Pages on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without the token, the build and tests still run and the
# upload step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:local
        env:
          SITE_URL: https://omnilaya.pages.dev/
      - name: Upload to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler pages deploy dist-local --project-name omnilaya --branch main --commit-hash ${{ github.sha }}
      - name: Note the skipped upload
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built and tested but not uploaded."

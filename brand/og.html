<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniLaya share image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,500&family=Hanken+Grotesk:wght@400;500&family=Recursive:wght,CASL,MONO@400..600,0..1,0..1&display=swap">
<style>
  /* Rendered at 1200x630 into public/og-home.png. Colours and faces from DESIGN.md. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4eee3; color: #1b1a17; font-family: 'Hanken Grotesk', sans-serif; }
  .wash { position: absolute; left: 50%; top: 50%; width: 1300px; transform: translate(-50%, -50%); opacity: 0.1; }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { margin: 20px 0 0; font: 700 86px/1 'Shippori Mincho', Georgia, serif; letter-spacing: -0.02em; }
  h1 span { font-weight: 500; color: #635f57; }
  .sentence { margin: 30px 0 0; font: 400 34px/1.4 Literata, Georgia, serif; }
  .pick { border-bottom: 3px solid #b8321c; padding: 0 2px; }
  .mark { margin-top: 26px; display: flex; gap: 28px; align-items: center; font: 22px Recursive, monospace; font-variation-settings: 'MONO' 1, 'CASL' 0.6; color: #b8321c; }
  .tick { width: 120px; height: 6px; border-radius: 3px; background: rgba(184, 50, 28, 0.14); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 12px; }
  .tick i { display: block; width: 91%; height: 100%; background: #b8321c; }
  .stamp { border: 2px solid #b8321c; border-radius: 6px; padding: 2px 10px; transform: rotate(-2deg); }
  .foot { position: absolute; bottom: 30px; font: 17px Recursive, monospace; font-variation-settings: 'MONO' 1, 'CASL' 0.6; color: #635f57; }
</style>
</head>
<body>
  <img class="wash" src="../public/wash.webp" alt="">
  <div class="wrap">
    <img src="logo/mark-wash.svg" width="104" height="104" alt="">
    <h1>OmniLaya <span>Search</span></h1>
    <p class="sentence">Laya searched <span class="pick">Hacker News</span> from <span class="pick">the past month</span>.</p>
    <div class="mark"><span>91 on topic<span class="tick"><i></i></span></span><span class="stamp">official: yes 96</span></div>
    <div class="foot">open source · scores you can see and correct · no generated answers</div>
  </div>
</body>
</html>

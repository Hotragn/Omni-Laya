    />
    <script>
      (() => {
        const root = document.documentElement;
        let theme;
        try { theme = localStorage.getItem('omnilaya-theme'); } catch {}
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#15140f' : '#f4eee3');
      })();
    </script>

  <body class="min-h-dvh">
    <div id="root"></div>
    <noscript>OmniLaya runs Laya in your browser, so it needs JavaScript.</noscript>

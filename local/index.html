<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4eee3" />
    <title>OmniLaya Search: links, not answers</title>
    <meta
      name="description"
      content="Search that gives you links, not AI answers. A small model in your browser picks where to look (the open web, GitHub, npm, Stack Overflow, Hacker News, papers, Wikipedia) and ranks every result. No account, no tracking, free and open source."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OmniLaya Search" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="OmniLaya Search: links, not answers" />
    <meta property="og:description" content="Ask in plain words. A model in your browser picks where to look and ranks every link. No AI answers, no account, no tracking." />
    <meta property="og:image" content="%SITE_URL%og-home.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OmniLaya Search: Links, not answers. A search for how to debounce a function in JavaScript, where Laya searched the open web, Stack Overflow and npm, and scored a Stack Overflow answer 97 on topic." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OmniLaya Search: links, not answers" />
    <meta name="twitter:description" content="Ask in plain words. A model in your browser picks where to look and ranks every link. No AI answers, no account, no tracking." />
    <meta name="twitter:image" content="%SITE_URL%og-home.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OmniLaya Search",
        "url": "%SITE_URL%",
        "description": "Search that gives you links, not AI answers. A small model in your browser picks where to look and ranks every result.",
        "applicationCategory": "SearchApplication",
        "operatingSystem": "Any browser with WebGPU, or any modern browser on the CPU",
        "browserRequirements": "Requires JavaScript. WebGPU recommended.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/Hotragn/Omni-Laya",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "%SITE_URL%?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,500&family=Hanken+Grotesk:wght@400;500;600&family=Recursive:wght,CASL,MONO@400..600,0..1,0..1&display=swap"
    />
    <script>
      (() => {
        const root = document.documentElement;
        let theme;
        try { theme = localStorage.getItem('omnilaya-theme'); } catch {}
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#15140f' : '#f4eee3');
      })();
    </script>
  </head>
  <body class="min-h-dvh">
    <div id="root"></div>
    <noscript>OmniLaya runs Laya in your browser, so it needs JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
